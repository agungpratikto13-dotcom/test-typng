<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Typing Speed Test Indonesia</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
<link rel="stylesheet" href="style.css">

</head>

<body>



<div class="overlay"></div>

<div class="wrapper">

    <!-- ========================= -->
    <!-- PANEL KIRI -->
    <!-- ========================= -->

    <div class="main">

        <h1>⌨️ TES KECEPATAN MENGETIK</h1>

        <div class="topMenu">

            <input
                id="nama"
                type="text"
                placeholder="Masukkan Nama">

            <select id="level">

                <option value="mudah">🟢 Mudah</option>
                <option value="sedang">🟡 Sedang</option>
                <option value="sulit">🔴 Sulit</option>

            </select>

            <select id="durasi">

                <option value="30">30 Detik</option>
                <option value="60" selected>60 Detik</option>
                <option value="120">120 Detik</option>

            </select>

        </div>

        <div id="timer">

            60

        </div>

        <div id="text">

            Tekan tombol mulai.

        </div>

        <textarea
            id="input"
            placeholder="Mulai mengetik..."
            disabled>
        </textarea>

        <div class="buttonBox">

            <button id="start">

                🚀 MULAI

            </button>

            <button id="ulang">

                🔄 ULANG

            </button>

        </div>

        <!-- ================= -->

        <div class="statistik">

            <div class="card">

                ⚡ KPM

                <span id="kpm">

                    0

                </span>

            </div>

            <div class="card">

                🌍 WPM

                <span id="wpm">

                    0

                </span>

            </div>

            <div class="card">

                🎯 Akurasi

                <span id="akurasi">

                    0%

                </span>

            </div>

            <div class="card">

                ✅ Benar

                <span id="benar">

                    0

                </span>

            </div>

            <div class="card">

                ❌ Salah

                <span id="salah">

                    0

                </span>

            </div>

        </div>

    </div>

    <!-- ========================= -->
    <!-- PANEL KANAN -->
    <!-- ========================= -->

    <div class="sidebar">

        <h2>

            🏆 LEADERBOARD

        </h2>

        <div id="leaderboard">

        <p>Belum ada pemain</p>

        </div>

        <hr>

        <h2>

            ⭐ HIGH SCORE

        </h2>

        <div id="highscore">

            Belum ada data

        </div>

        <hr>

        <h2>

            👑 RANK

        </h2>

        <div id="rank">

            Beginner

        </div>

        <hr>

        <h2>

            📜 RIWAYAT

        </h2>

        <div id="history">

        </div>

        <button id="resetRanking">

            🗑 Reset Ranking

        </button>

    </div>

</div>

<!-- Popup -->

<div id="popup">

    <div class="popupContent">

        <h2>

            🏆 HASIL

        </h2>

        <div id="hasil">

        </div>

        <button id="closePopup">

            Tutup

        </button>

    </div>

</div>

<script src="kata.js"></script>

<script type="module" src="firebase.js"></script>
<script type="module" src="leaderboard.js"></script>
<script type="module" src="script.js"></script>

</body>
</html>
